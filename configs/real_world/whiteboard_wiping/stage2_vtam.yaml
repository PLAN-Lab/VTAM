# VTAM real-robot config: whiteboard wiping -- Stage II: VTAM action learning (flow-matching action expert, end-to-end with the backbone, flow-force proxy in the action target). Paper result config.
# Paths are placeholders: set <DATA_ROOT>, <OUTPUT_ROOT> and <PRETRAINED_ROOT> for your setup.
model_name: 'ltx_train'
is_i2v: True
report_to: None
tracker_name: ltx_trainer

logging_dir: logs
output_dir: <OUTPUT_ROOT>/whiteboard_wiping/stage2_vtam
pretrained_model_name_or_path: <PRETRAINED_ROOT>/ltx_video

train_data_class_path: data/libero_dataset.py
train_data_class: CustomLeRobotDataset
val_data_class_path: data/libero_dataset.py
val_data_class: CustomLeRobotDataset

tokenizer_class_path: transformers
tokenizer_class: T5Tokenizer
textenc_class_path: transformers
textenc_class: T5EncoderModel
vae_class_path: models/ltx_models/autoencoder_kl_ltx.py
vae_class: AutoencoderKLLTXVideo
diffusion_model_class_path: models/ltx_models/transformer_ltx_multiview.py
diffusion_model_class: LTXVideoTransformer3DModel
diffusion_scheduler_class_path: diffusers
diffusion_scheduler_class: FlowMatchEulerDiscreteScheduler

pipeline_class_path: models/pipeline/custom_pipeline.py
pipeline_class: CustomPipeline

return_action: true
return_video: false
train_mode: 'action_full'
action_loss_scale: 1.0

train_steps: 1000000
train_epochs: 10000
steps_to_save: 10000
steps_to_log: 20
steps_to_val: 1000000000

mixed_precision: bf16
allow_tf32: False

nccl_timeout: 600
seed: 42

enable_slicing: True
enable_tiling: True

add_state: True
rand_init_action: True

caption_dropout_p: 0.06

batch_size: 16
dataloader_num_workers: 8
pin_memory: True

gradient_checkpointing: True
noise_to_first_frame: 0.1

optimizer: adamw
lr: 5e-5
beta1: 0.9
beta2: 0.95
beta3: 0.999
epsilon: 1e-8
weight_decay: 1e-5
optimizer_8bit: False
optimizer_torchao: False
scale_lr: False

max_grad_norm: 1.0
gradient_accumulation_steps: 1

lr_scheduler: constant_with_warmup
lr_warmup_steps: 1000
lr_num_cycles: 1
lr_power: 1.0

flow_weighting_scheme: none
flow_logit_mean: 0.0
flow_logit_std: 1.0
flow_mode_scale: 1.29

pixel_wise_timestep: True

diffusion_model:
  model_path: <OUTPUT_ROOT>/whiteboard_wiping/stage1_world_model/step_50000/diffusion_pytorch_model.safetensors
  config:
    activation_fn: gelu-approximate
    attention_bias: true
    attention_head_dim: 64
    attention_out_bias: true
    caption_channels: 4096
    cross_attention_dim: 2048
    in_channels: 128
    norm_elementwise_affine: false
    norm_eps: 1.0e-6
    num_attention_heads: 32
    num_layers: 28
    out_channels: 128
    patch_size: 1
    patch_size_t: 1
    qk_norm: rms_norm_across_heads
    action_expert: true
    action_in_channels: 26
    action_out_channels: 26
    action_num_attention_heads: 16
    action_attention_head_dim: 32

data:
  train:
    data_roots: ["<DATA_ROOT>/task_hard_wipe_force_in_action_lerobot"]
    domains: ["task_hard_wipe_force_in_action"]
    sample_size: [192, 256]
    sample_n_frames: 900
    preprocess :  'resize'
    valid_cam :  ['realsense_0', 'realsense_1', 'gelsight']
    chunk: 9
    action_chunk: 54
    n_previous: 4
    previous_pick_mode: 'random'
    random_crop: False
    ignore_seek: True
    action_type: "absolute"
    action_space: "joint"
    stat_file: configs/real_world/whiteboard_wiping/stats.json
    state_key: state
    action_key: actions
    extra_parquet_index: False
    arm_dim: 6
    repeat_dataset: 1000
  val:
    data_roots: ["<DATA_ROOT>/task_hard_wipe_force_in_action_lerobot"]
    domains: ["task_hard_wipe_force_in_action"]
    sample_size: [192, 256]
    sample_n_frames: 900
    preprocess :  'resize'
    valid_cam : ['realsense_0', 'realsense_1', 'gelsight']
    chunk: 9
    action_chunk: 54
    n_previous: 4
    previous_pick_mode: 'random'
    random_crop: False
    ignore_seek: True
    action_type: "absolute"
    action_space: "joint"
    stat_file: configs/real_world/whiteboard_wiping/stats.json
    state_key: state
    action_key: actions
    extra_parquet_index: False
    arm_dim: 6

use_color_jitter: true
num_inference_step: 10
noisy_video: true

load_weights: true

use_deepspeed: true
deepspeed:
  zero_optimization:
    stage: 2
  fp16:
    enabled: false
  bf16:
    enabled: true
  gradient_clipping: 1.0
